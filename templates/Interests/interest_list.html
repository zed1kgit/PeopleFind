{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
    <header class="page-head">
        <h1>Интересы</h1>
        <p class="muted">Все интересы, от самых популярных</p>
    </header>
    <div class="interest-grid">
        {% for interest in object_list %}
            {% include 'includes/interest_info_inc.html' with object=interest %}
        {% empty %}
            <p class="nothing-here">Интересов пока нет</p>
        {% endfor %}
    </div>
{% endblock %}
