{% extends 'base.html' %}

{% block content %}
    <section class="auth-card">
        <h1>{% if object %}{{ object.name }}{% else %}Создание нового интереса{% endif %}</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">{% if object %}Сохранить{% else %}Создать{% endif %}</button>
                <a class="btn btn-outline-secondary" href="{% url 'interests:list' %}">Отмена</a>
            </div>
        </form>
    </section>
{% endblock %}
