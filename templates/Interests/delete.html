{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
    <section class="auth-card">
        <form method="post">
            <h1>Удалить интерес «{{ object.name }}»?</h1>
            <p class="muted">Это действие нельзя отменить: вместе с интересом удалятся его топики и комментарии.</p>
            {% csrf_token %}
            <div class="form-actions">
                <button class="btn btn-danger">Удалить</button>
                <a class="btn btn-outline-secondary" href="{% url 'interests:detail' object.pk %}">Отмена</a>
            </div>
        </form>
    </section>
{% endblock %}
