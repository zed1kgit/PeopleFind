{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
    <div class="find choose" data-found-url="{% url 'interests:user-found' %}">
        <div id="user-detail" class="find-card">
            {% include 'includes/user_detail.html' with object=found_user compact=True %}
        </div>
        <a class="area deny" role="button" tabindex="0" aria-label="Пропустить"
           data-url="{% url 'interests:deny-user' %}"
           data-user-id="{{ found_user.pk }}">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg><span>Пропустить</span>
        </a>
        <a class="area approve" role="button" tabindex="0" aria-label="Одобрить"
           data-url="{% url 'interests:approve-user' %}"
           data-user-id="{{ found_user.pk }}">
            <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Одобрить</span>
        </a>
    </div>
{% endblock %}
