{% if user.is_authenticated %}
    <form method="post" accept-charset="UTF-8" id="comment_form" class="new-comment"
          data-type="{{ type }}" data-id="{{ id }}" data-url="{% url 'topics:new-comment' %}">
        <p>
            <label for="id_comment" class="headline">Ваш комментарий</label>
            <textarea name="comment" id="id_comment" cols="30" rows="3" maxlength="2000"
                      placeholder="Ваш комментарий..." required class="form-control"></textarea>
        </p>
        <button class="btn btn-success" type="submit">Отправить</button>
    </form>
{% endif %}
