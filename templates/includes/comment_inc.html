{% load my_tags humanize %}
<div class="comment" id="comment-{{ object.pk }}">
    <a class="comment-avatar" href="{% url 'users:profile' object.user.slug %}">
        <img class="avatar avatar-sm" alt="{{ object.user.name }}" src="{{ object.user.avatar|user_media }}" width="32" height="32">
    </a>
    <div class="comment-body">
        <div class="comment-head">
            <a class="name" href="{% url 'users:profile' object.user.slug %}">{{ object.user.name }}</a>
            <time class="muted" datetime="{{ object.created_at|date:'c' }}" title="{{ object.created_at }}">{{ object.created_at|naturaltime }}</time>
        </div>
        <div class="comment-text">{{ object.text|linebreaksbr }}</div>
    </div>
    {% if user.is_authenticated %}
        {% if user == object.user or user.role == 'moderator' or user.role == 'admin' %}
            <button type="button" class="icon-btn danger item-delete" title="Удалить" aria-label="Удалить комментарий"
                    data-type="comment" data-id="{{ object.pk }}" data-url="{% url 'topics:delete' %}">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
            </button>
        {% endif %}
    {% endif %}
</div>
