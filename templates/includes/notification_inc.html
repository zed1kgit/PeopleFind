{% load humanize %}
<div class="notification">
    <button type="button" class="new-marker{% if object.viewed %} off{% endif %}" data-id="{{ object.pk }}"
            data-url="{% url 'users:mark_as_read' object.pk %}"
            title="{% if object.viewed %}Прочитано{% else %}Отметить прочитанным{% endif %}"
            aria-label="{% if object.viewed %}Прочитано{% else %}Отметить прочитанным{% endif %}"></button>
    <div class="notification-main">
        <div class="notification-head">
            <span class="notification-title">{{ object.title }}</span>
            <time class="muted" datetime="{{ object.date_created|date:'c' }}" title="{{ object.date_created }}">{{ object.date_created|naturaltime }}</time>
        </div>
        <div class="notification-body">
            {% if object.from_user %}
                Пользователь <a href="{% url 'users:profile' object.from_user.slug %}">{{ object.from_user.name }}</a> также одобрил вас!<br>
                Контакты для связи: {{ object.from_user.contacts|default:"не указаны" }}
            {% else %}
                {{ object.message|linebreaksbr }}
            {% endif %}
        </div>
    </div>
</div>
