{% load humanize %}
<div class="notification">
    <div class="inner">
        <aside class="markers"><div class="new-marker{% if object.viewed %} off{% endif %}" data-id="{{ object.pk }}"
                                    data-url="{% url 'users:mark_as_read' object.pk %}"></div></aside>
        <header>
            <span class="name">{{ object.title }}</span>
            <span class="time"><time datetime="{{ object.date_created|date:'c' }}" title="{{ object.date_created }}">{{ object.date_created|naturaltime }}</time></span>
        </header>
        <div class="body">
            {% if object.from_user %}
                Пользователь <a href="{% url 'users:profile' object.from_user.slug %}">{{ object.from_user.name }}</a> также одобрил вас!<br>
                Контакты для связи: {{ object.from_user.contacts|default:"не указаны" }}
            {% else %}
                {{ object.message|linebreaksbr }}
            {% endif %}
        </div>
    </div>
</div>
