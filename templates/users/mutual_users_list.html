{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
    <header class="page-head">
        <h1>Взаимные пользователи</h1>
        <p class="muted">Люди, с которыми у вас взаимное одобрение</p>
    </header>
    <div class="user-grid">
        {% for member in object_list %}
            {% include 'includes/user_info_inc.html' with object=member %}
        {% empty %}
            <p class="nothing-here">Пока нет взаимных одобрений</p>
        {% endfor %}
    </div>
{% endblock %}
