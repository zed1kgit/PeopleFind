{% extends 'base.html' %}

{% block content %}
    <section class="auth-card">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Войти</button>
                <a class="btn btn-outline-secondary" href="{% url 'users:register' %}">Создать аккаунт</a>
            </div>
        </form>
    </section>
{% endblock %}
